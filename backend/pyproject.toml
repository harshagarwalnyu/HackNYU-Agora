[project]
name = "agora-backend"
version = "0.1.0"
description = "Agora - Voice-first Socratic tutor backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "aiofiles>=23.2.1",
    "python-socketio>=5.14.0",
    "langgraph>=0.0.32",
    "langchain>=0.2.5",
    "langchain-google-genai>=0.0.6",
    "google-generativeai>=0.3.2",
    "qdrant-client>=1.8.0",
    "deepgram-sdk>=3.2.0",
    "elevenlabs>=0.2.27",
    "openai-whisper>=20231117",
    "faster-whisper>=0.10.0",
    "docling>=2.0.1",
    "docling-core>=1.0.0",
    "python-json-logger>=2.0.7",
    "websockets>=12.0",
    "ddgs>=9.10.0",
    "slowapi>=0.1.9",
    "groq>=0.9.0",
    "sentence-transformers>=2.3.1",
    "edge-tts>=6.1.10",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.12.1",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "socketio.*",
    "PyPDF2.*",
    "aiofiles.*",
    "lxml.*",
    "sentence_transformers.*",
    "docling.*",
    "edge_tts.*",
    "groq.*",
    "qdrant_client.*",
    "google.generativeai.*",
    "langchain.*",
    "langgraph.*"
]
ignore_missing_imports = true
